name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Auto Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(cat VERSION | tr -d '[:space:]')
          echo "version=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get previous tag
        if: steps.check.outputs.exists == 'false'
        id: prev
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: steps.check.outputs.exists == 'false'
        id: notes
        run: |
          prev="${{ steps.prev.outputs.tag }}"
          next="${{ steps.version.outputs.version }}"
          range="HEAD"
          if [ -n "$prev" ]; then
            range="${prev}..HEAD"
          fi

          {
            echo "notes<<NOTES_EOF"
            echo "## Changes"
            echo ""
            git log "$range" --oneline --no-merges | while read -r line; do
              echo "- $line"
            done
            echo ""
            if [ -n "$prev" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${prev}...${next}"
            fi
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --target main \
            --title "${{ steps.version.outputs.version }}" \
            --notes "${{ steps.notes.outputs.notes }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger pkg.go.dev update
        if: steps.check.outputs.exists == 'false'
        run: |
          curl -s -X POST "https://pkg.go.dev/fetch/github.com/${{ github.repository }}@${{ steps.version.outputs.version }}" || true
