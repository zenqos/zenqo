name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Auto Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Determine next version
        id: next
        run: |
          current="${{ steps.latest.outputs.tag }}"
          major=$(echo "$current" | cut -d. -f1 | tr -d v)
          minor=$(echo "$current" | cut -d. -f2)
          patch=$(echo "$current" | cut -d. -f3)

          # Check commits since last tag for feat commits
          has_feat=$(git log "$current"..HEAD --oneline --grep="^feat" | head -1)

          if [ -n "$has_feat" ]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          next="v${major}.${minor}.${patch}"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "${{ steps.next.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        if: steps.check.outputs.exists == 'false'
        id: notes
        run: |
          current="${{ steps.latest.outputs.tag }}"
          next="${{ steps.next.outputs.version }}"

          {
            echo "notes<<NOTES_EOF"
            echo "## Changes"
            echo ""
            git log "$current"..HEAD --oneline --no-merges | while read -r line; do
              echo "- $line"
            done
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${current}...${next}"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "${{ steps.next.outputs.version }}" \
            --target main \
            --title "${{ steps.next.outputs.version }}" \
            --notes "${{ steps.notes.outputs.notes }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger pkg.go.dev update
        if: steps.check.outputs.exists == 'false'
        run: |
          curl -s -X POST "https://pkg.go.dev/fetch/github.com/${{ github.repository }}@${{ steps.next.outputs.version }}" || true
